<header class="top-navbar">

  <!-- Desktop toggle -->
  <button
    mat-icon-button
    class="toggle-btn d-none d-lg-flex"
    (click)="onToggle()"
    aria-label="Toggle sidebar"
  >
   <tabler-icon [icon]="toggleIconName"></tabler-icon>
  </button>


  <!-- Mobile toggle -->
  <button
    mat-icon-button
    class="toggle-btn d-flex d-lg-none"
    (click)="onToggleMobile()"
    aria-label="Open sidebar"
  >
   <tabler-icon [icon]="toggleIconName"></tabler-icon>
  </button>


    <app-breadcrumb />


  <!-- Right -->
    <div class="navbar-actions">

          <tabler-icon icon="layout-sidebar-left-collapse"></tabler-icon>

    <!-- User -->
    <button type="button" class="user-profile profile" [matMenuTriggerFor]="menu" aria-label="Open user menu">
      <div class="avatar" >
        Y
      </div>
    </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item routerLink="/profile">
          <tabler-icon icon="user-circle" [size]="16" class="text-muted me-2"></tabler-icon>
          <span class="text-muted">Profile</span>
        </button>
        <button mat-menu-item (click)="onLogout()">
          <tabler-icon icon="logout" [size]="16" class="text-muted me-2"></tabler-icon>
          <span class="text-muted">Logout</span>
        </button>
      </mat-menu>

  </div>

</header>
