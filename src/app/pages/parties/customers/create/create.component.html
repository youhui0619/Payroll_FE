<form [formGroup]="customerForm" (ngSubmit)="onSubmit(customerForm)">
    <app-forms [fields]="customers" [form]="customerForm"></app-forms>
    <div class="d-flex align-items-center justify-content-end gap-3">
        <button type="button" mat-flat-button color="primary-outline"><i-tabler name="check"></i-tabler>Draft</button>
        <button type="submit" mat-flat-button color="primary"><i-tabler name="check"></i-tabler>Submit</button>
    </div>
</form>
