<form [formGroup]="notificationForm" (ngSubmit)="onSubmit(notificationForm)">
    @for (group of notificationGroups; track group.id) {
        <section class="notification-group mb-4">
            <h4 class="text-primary my-0">{{ group.title }}</h4>
            <p class="text-muted mt-0 mb-2">{{ group.description }}</p>
            <div class="card">
                <div class="card-body">
                    @for (preference of group.preferences; track preference.id) {
                    <div class="d-flex justify-content-between align-items-center gap-3 py-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="icon bg-light-primary text-primary flex-shrink-0">
                                <tabler-icon [icon]="preference.icon"></tabler-icon>
                            </div>
                            <div>
                                <label class="text-dark fw-550 my-0">{{ preference.title }}</label>
                                <p class="text-muted mb-0">{{ preference.description }}</p>
                            </div>
                        </div>
                        <mat-slide-toggle
                            color="primary"
                            [formControlName]="preference.id"
                            [aria-label]="preference.title">
                        </mat-slide-toggle>
                    </div>
                    }
                </div>
            </div>
        </section>
    }
   <div class="d-flex justify-content-end">
        <button type="submit" mat-flat-button color="primary">
            <tabler-icon icon="check" [size]="16"></tabler-icon> Save Preferences
        </button>
    </div>
</form>
