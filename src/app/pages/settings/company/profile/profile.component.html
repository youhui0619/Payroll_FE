<form [formGroup]="companyForm" (ngSubmit)="onSubmit(companyForm)">
    <app-forms [fields]="companyFields" [form]="companyForm"></app-forms>
    <div class="d-flex align-items-center justify-content-end gap-3">
        <button type="submit" mat-flat-button color="primary"><tabler-icon icon="check"></tabler-icon>Submit</button>
    </div>
</form>
