<!-- Layout-only dropdown content. The trigger/button lives in the header. -->
@if (isOpen) {
  <div class="notification-dropdown">
    @if (mode === 'notifications') {
      <div class="dropdown-header">
        <strong>Notifications</strong>
        <button class="mark-read" (click)="onMarkAllRead()">Mark all read</button>
      </div>
      <div class="dropdown-list">
        @for (n of notifications; track n) {
          <div class="notification-item" [class.unread]="n.unread">
            <div class="notif-title">{{ n.title }}</div>
            <div class="notif-meta">{{ n.time }}</div>
          </div>
        }
        @if (notifications.length === 0) {
          <div class="notification-empty">No notifications</div>
        }
      </div>
    } @else {
      <div class="dropdown-content">
        <ng-content></ng-content>
      </div>
    }
  </div>
}
